name: Build and Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish portable single-file (self-contained, compressed)
      run: >
        dotnet publish WinWidgetPerf.csproj -c Release -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:EnableCompressionInSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:IncludeAllContentForSelfExtract=true
        -o publish

    - name: Zip artifacts
      run: Compress-Archive -Path publish\* -DestinationPath WinWidgetPerf.zip

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinWidgetPerf
        path: WinWidgetPerf.zip
        retention-days: 30

    - name: Create GitHub Release and attach zip
      uses: softprops/action-gh-release@v2
      with:
        files: WinWidgetPerf.zip
